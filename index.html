<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone 18 Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --void:#050506; --ink:#f5f5f7; --dim:rgba(245,245,247,.55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--void); color: var(--ink);
    font-family: "SF Pro Text", Inter, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--void); }
  #start { position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer; background: transparent;
    border: 0; color: var(--ink); font: inherit; }
  #start span { display: inline-flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(12px);
    font-size: 15px; letter-spacing: .02em; }
  #start[hidden] { display: none; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(720px, calc(100vw - 32px));
    display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 999px;
    background: rgba(20,20,24,.6); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(14px);
    opacity: 0; transition: opacity .4s; }
  body:hover #bar, #bar:focus-within, body.paused #bar { opacity: 1; }
  #bar button { all: unset; cursor: pointer; width: 28px; height: 28px; display: grid; place-items: center; }
  #bar input { flex: 1; accent-color: #7fd6ff; }
  #time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--dim); min-width: 84px; text-align: right; }
  body.render #bar, body.render #start { display: none; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render #stage { place-items: start; }
</style>
</head>
<body class="paused">
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<button id="start" aria-label="Play with sound"><span>
  <svg width="14" height="16" viewBox="0 0 14 16"><path d="M0 0L14 8L0 16Z" fill="currentColor"/></svg>
  <b id="startLabel" style="font-weight:500">Preparing sound…</b></span></button>
<div id="bar">
  <button id="pp" aria-label="Play / pause"><svg id="ppIcon" width="14" height="16" viewBox="0 0 14 16"><path d="M0 0L14 8L0 16Z" fill="#f5f5f7"/></svg></button>
  <input id="scrub" type="range" min="0" max="30" step="0.01" value="0" aria-label="Timeline">
  <span id="time">0:00.0 / 0:30</span>
</div>
<script>
'use strict';
// ───────────────────────────── Core helpers ─────────────────────────────
const W = 1920, H = 1080, DUR = 30, FPS = 24;
const BPM = 96, BEAT = 60 / BPM;
const C = { void:'#050506', graphite:'#1C1D21', ti:'#B9B4AB', white:'#F5F5F7',
  cyan:'#7FD6FF', violet:'#6E5BFF', ember:'#FF9A5A' };
const FONT = '"SF Pro Display","Inter Display",Inter,system-ui,sans-serif';
const FONT_TEXT = '"SF Pro Text",Inter,system-ui,sans-serif';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInCubic = x => x * x * x;
const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eOutBack = x => { const c1 = 1.1, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const ease = (x) => 1 - Math.pow(1 - x, 4); // cubic-bezier(.22,1,.36,1)-ish
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const layer = mk(W, H), lctx = layer.getContext('2d');

// ───────────────────────────── Shared timing ─────────────────────────────
// UI icon "pour-in" times (Scene 5) — shared by picture and sound.
const ICON_T = Array.from({ length: 20 }, (_, i) => 19.85 + i * 0.055);

// ───────────────────────────── Pre-built assets ─────────────────────────────
let brushed, grain = [], city, liquidA, liquidB, dust, sparks;

function buildAssets() {
  const r = rng(11);
  // Brushed titanium: anisotropic horizontal micro-streaks.
  brushed = mk(2048, 600); { const g = brushed.getContext('2d');
    g.fillStyle = '#948f86'; g.fillRect(0, 0, 2048, 600);
    for (let i = 0; i < 5200; i++) { const y = r() * 600, x = r() * 2048, len = 120 + r() * 1300, light = r() > .5;
      g.strokeStyle = light ? `rgba(255,252,245,${.02 + r() * .09})` : `rgba(20,18,16,${.02 + r() * .1})`;
      g.lineWidth = .4 + r() * 1.3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (r() - .5) * .6); g.stroke();
      if (x + len > 2048) { g.beginPath(); g.moveTo(x - 2048, y); g.lineTo(x + len - 2048, y); g.stroke(); } } }
  // Film grain plates (35mm 400T feel).
  for (let k = 0; k < 6; k++) { const c = mk(640, 360), g = c.getContext('2d'), d = g.createImageData(640, 360);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 120; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    g.putImageData(d, 0, 0); grain.push(c); }
  city = buildCity();
  // Scene 2 liquid path: a phone corner, drawn in two directions from the droplet.
  const A = [], B = [];
  for (let y = 820; y >= 560; y -= 4) A.push([700, y]);
  for (let a = Math.PI; a <= Math.PI * 1.5 + 1e-6; a += 0.012) A.push([1000 + 300 * Math.cos(a), 560 + 300 * Math.sin(a)]);
  for (let x = 1004; x <= 2140; x += 4) A.push([x, 260]);
  for (let y = 820; y <= 1280; y += 4) B.push([700, y]);
  liquidB = poly(B); liquidA = poly(B.slice().reverse().concat(A.slice(1)));
  dust = Array.from({ length: 90 }, () => ({ x: r() * W, y: r() * H, z: .3 + r() * .7, p: r() * 6.28, s: 6 + r() * 14 }));
  sparks = Array.from({ length: 56 }, () => ({ s: r(), t0: 8 + r() * .5, vx: (r() - .5) * 90, vy: -40 - r() * 120, life: .6 + r() * .7, sz: 1 + r() * 2.2 }));
}

function poly(pts) { const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, len: cum[cum.length - 1] }; }
function polyAt(P, s) { s = clamp(s, 0, P.len); let i = 1; while (i < P.cum.length - 1 && P.cum[i] < s) i++;
  const a = P.pts[i - 1], b = P.pts[i], f = (s - P.cum[i - 1]) / ((P.cum[i] - P.cum[i - 1]) || 1); return [lerp(a[0], b[0], f), lerp(a[1], b[1], f)]; }
function polyPath(g, P, s0, s1) { g.beginPath(); const a = polyAt(P, s0); g.moveTo(a[0], a[1]);
  for (let i = 0; i < P.pts.length; i++) if (P.cum[i] > s0 && P.cum[i] < s1) g.lineTo(P.pts[i][0], P.pts[i][1]);
  const b = polyAt(P, s1); g.lineTo(b[0], b[1]); }

function buildCity() {
  const c = mk(1920, 1080), g = c.getContext('2d'), r = rng(42);
  const sky = g.createLinearGradient(0, 0, 0, 760);
  sky.addColorStop(0, '#03040a'); sky.addColorStop(.55, '#120f26'); sky.addColorStop(.85, '#3a2142'); sky.addColorStop(1, '#5b2f3c');
  g.fillStyle = sky; g.fillRect(0, 0, 1920, 1080);
  for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(255,255,255,${r() * .5})`; g.fillRect(r() * 1920, r() * 420, 1.4, 1.4); }
  const horizon = 760;
  const layerSky = (n, minH, maxH, col, lit, wmin) => { let x = -20;
    while (x < 1940) { const w = wmin + r() * wmin * 1.6, h = minH + Math.pow(r(), 1.6) * (maxH - minH);
      g.fillStyle = col; g.fillRect(x, horizon - h, w, h + 2);
      if (r() > .7) { g.fillRect(x + w * .45, horizon - h - 40 - r() * 60, 3, 60); g.fillStyle = 'rgba(255,80,80,.9)'; g.fillRect(x + w * .45 - 1, horizon - h - 100, 5, 5); }
      for (let wy = horizon - h + 10; wy < horizon - 6; wy += 9) for (let wx = x + 5; wx < x + w - 5; wx += 7)
        if (r() < lit) { const warm = r() > .35; g.fillStyle = warm ? `rgba(255,${190 + r() * 40 | 0},120,${.35 + r() * .6})` : `rgba(150,215,255,${.3 + r() * .6})`; g.fillRect(wx, wy, 3, 4); }
      x += w + r() * 6; } };
  layerSky(0, 80, 260, '#0d0d18', .22, 34);
  layerSky(1, 140, 520, '#07070d', .32, 52);
  const water = g.createLinearGradient(0, horizon, 0, 1080); water.addColorStop(0, '#120c1c'); water.addColorStop(1, '#030305');
  g.fillStyle = water; g.fillRect(0, horizon, 1920, 320);
  g.save(); g.globalAlpha = .45; g.translate(0, horizon * 2); g.scale(1, -1); g.filter = 'blur(6px)';
  g.drawImage(c, 0, 0, 1920, horizon, 0, 0, 1920, horizon); g.restore();
  for (let i = 0; i < 26; i++) { const x = r() * 1920, y = 800 + r() * 280, rad = 20 + r() * 70, warm = r() > .4;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, warm ? 'rgba(255,170,90,.22)' : 'rgba(127,214,255,.2)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill(); }
  return c;
}

// ───────────────────────────── Drawing primitives ─────────────────────────────
function text(g, str, x, y, o) {
  const { size = 48, weight = 500, family = FONT, align = 'center', alpha = 1, blur = 0, dy = 0, spacing = 0, color = C.white, scale = 1 } = o;
  if (alpha <= 0.002) return;
  g.save(); g.globalAlpha *= alpha; g.translate(x, y + dy); g.scale(scale, scale);
  g.font = `${weight} ${size}px ${family}`; g.textAlign = align; g.textBaseline = 'middle';
  g.letterSpacing = spacing + 'px'; if (blur > .05) g.filter = `blur(${blur}px)`;
  g.fillStyle = color; g.fillText(str, 0, 0); g.restore();
}
// Brief: fade + 6px upward drift + blur 4→0 in; blur-dissolve out.
function typeIn(t, tIn, tOut, dur = .5) {
  const p = ease(seg(t, tIn, tIn + dur)), q = tOut == null ? 0 : eInOutCubic(seg(t, tOut, tOut + .5));
  return { alpha: p * (1 - q), dy: (1 - p) * 6, blur: (1 - p) * 4 + q * 12 };
}

function tiGrad(g, x0, x1) {
  const gr = g.createLinearGradient(x0, 0, x1, 0);
  [[0, '#3c3a37'], [.025, '#d8d3ca'], [.07, '#8a857d'], [.3, '#a8a399'], [.7, '#97928a'], [.93, '#7e7a72'], [.975, '#d0cbc2'], [1, '#353330']].forEach(s => gr.addColorStop(s[0], s[1]));
  return gr;
}

function wallpaper(g, x, y, w, h, t, k = 1) {
  g.fillStyle = '#06050b'; g.fillRect(x, y, w, h);
  const blob = (cx, cy, rad, col) => { const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rad); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x, y, w, h); };
  g.save(); g.globalAlpha = k;
  blob(x + w * (.3 + .05 * Math.sin(t * .6)), y + h * (.28 + .03 * Math.cos(t * .5)), w * 1.0, 'rgba(110,91,255,.85)');
  blob(x + w * (.85 + .04 * Math.cos(t * .7)), y + h * .78, w * .85, 'rgba(127,214,255,.6)');
  blob(x + w * .1, y + h * .95, w * .5, 'rgba(255,154,90,.35)');
  g.globalCompositeOperation = 'screen';
  const rb = g.createLinearGradient(x, y + h * .3, x + w, y + h * .7); rb.addColorStop(0, 'rgba(255,255,255,0)'); rb.addColorStop(.5, 'rgba(255,255,255,.18)'); rb.addColorStop(1, 'rgba(255,255,255,0)');
  g.strokeStyle = rb; g.lineWidth = w * .22; g.lineCap = 'round'; g.filter = `blur(${w * .03}px)`;
  g.beginPath(); g.moveTo(x - w * .2, y + h * (.75 + .03 * Math.sin(t))); g.bezierCurveTo(x + w * .3, y + h * .35, x + w * .7, y + h * .9, x + w * 1.2, y + h * .3); g.stroke();
  g.restore();
}

// Phone front. Origin = phone centre; unit scale = 440×900 body.
const PW = 440, PH = 900, PR = 72, INSET = 20;
function phoneFront(g, screenFn) {
  rr(g, -PW / 2, -PH / 2, PW, PH, PR); g.fillStyle = tiGrad(g, -PW / 2, PW / 2); g.fill();
  // buttons
  g.fillStyle = '#7d786f'; rr(g, -PW / 2 - 4, -250, 5, 60, 2); g.fill(); rr(g, -PW / 2 - 4, -160, 5, 95, 2); g.fill(); rr(g, -PW / 2 - 4, -50, 5, 95, 2); g.fill();
  rr(g, PW / 2 - 1, -170, 5, 140, 2); g.fill(); rr(g, PW / 2 - 1, 120, 5, 90, 2); g.fill();
  rr(g, -PW / 2 + 7, -PH / 2 + 7, PW - 14, PH - 14, PR - 7); g.fillStyle = '#020203'; g.fill();
  const sx = -PW / 2 + INSET, sy = -PH / 2 + INSET, sw = PW - INSET * 2, sh = PH - INSET * 2;
  g.save(); rr(g, sx, sy, sw, sh, PR - INSET * .8); g.clip(); screenFn && screenFn(g, sx, sy, sw, sh); g.restore();
  // glass edge refraction + frame specular
  rr(g, -PW / 2 + 7, -PH / 2 + 7, PW - 14, PH - 14, PR - 7); g.strokeStyle = 'rgba(127,214,255,.22)'; g.lineWidth = 1.5; g.stroke();
  const sp = g.createLinearGradient(-PW / 2, -PH / 2, PW / 2, PH / 2); sp.addColorStop(0, 'rgba(255,255,255,.7)'); sp.addColorStop(.35, 'rgba(255,255,255,0)'); sp.addColorStop(1, 'rgba(255,255,255,.15)');
  rr(g, -PW / 2 + 1, -PH / 2 + 1, PW - 2, PH - 2, PR - 1); g.strokeStyle = sp; g.lineWidth = 2; g.stroke();
  return { sx, sy, sw, sh };
}
function island(g, sx, sy, sw, w, h) {
  rr(g, sx + sw / 2 - w / 2, sy + 22, w, h, h / 2); g.fillStyle = '#000'; g.fill();
  g.fillStyle = '#0d0f16'; g.beginPath(); g.arc(sx + sw / 2 + w / 2 - h / 2, sy + 22 + h / 2, h * .22, 0, 7); g.fill();
}
function lens(g, x, y, r, rot) {
  const ring = g.createRadialGradient(x - r * .3, y - r * .3, r * .2, x, y, r * 1.25);
  ring.addColorStop(0, '#e2ddd4'); ring.addColorStop(.7, '#8d887f'); ring.addColorStop(1, '#3d3b37');
  g.fillStyle = ring; g.beginPath(); g.arc(x, y, r * 1.22, 0, 7); g.fill();
  g.fillStyle = '#050608'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  const dc = g.createConicGradient(rot, x, y); [[0, 'rgba(110,91,255,.55)'], [.33, 'rgba(255,154,90,.35)'], [.66, 'rgba(127,214,255,.4)'], [1, 'rgba(110,91,255,.55)']].forEach(s => dc.addColorStop(s[0], s[1]));
  for (const f of [.85, .62, .4]) { g.strokeStyle = dc; g.lineWidth = r * .05; g.beginPath(); g.arc(x, y, r * f, 0, 7); g.stroke(); }
  g.fillStyle = '#010102'; g.beginPath(); g.arc(x, y, r * .3, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.ellipse(x - r * .35, y - r * .38, r * .14, r * .08, -.7, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.arc(x + r * .3, y + r * .32, r * .06, 0, 7); g.fill();
}
function phoneBack(g, rot) {
  rr(g, -PW / 2, -PH / 2, PW, PH, PR); g.fillStyle = tiGrad(g, -PW / 2, PW / 2); g.fill();
  const bg = g.createLinearGradient(-PW / 2, -PH / 2, PW / 2, PH / 2);
  bg.addColorStop(0, '#d9d4cb'); bg.addColorStop(.45, '#b4aea4'); bg.addColorStop(.55, '#c2bcb2'); bg.addColorStop(1, '#9e988e');
  rr(g, -PW / 2 + 7, -PH / 2 + 7, PW - 14, PH - 14, PR - 7); g.fillStyle = bg; g.fill();
  const P = 190, px = -PW / 2 + 26, py = -PH / 2 + 26;
  rr(g, px, py, P, P, 48); const pg = g.createLinearGradient(px, py, px + P, py + P); pg.addColorStop(0, '#e4dfd6'); pg.addColorStop(1, '#a9a399');
  g.fillStyle = pg; g.fill(); g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1.5; g.stroke();
  lens(g, px + P * .29, py + P * .29, 30, rot); lens(g, px + P * .29, py + P * .71, 30, rot + 1); lens(g, px + P * .71, py + P * .5, 30, rot + 2);
  g.fillStyle = '#f3e9cf'; g.beginPath(); g.arc(px + P * .71, py + P * .18, 10, 0, 7); g.fill();
  g.fillStyle = '#1b1b1d'; g.beginPath(); g.arc(px + P * .71, py + P * .82, 8, 0, 7); g.fill();
}

// ───────────────────────────── SCENE 1 · Origin (0–4) ─────────────────────────────
function droplet(g, x, y, rx, ry) {
  const glow = g.createRadialGradient(x, y, rx * .5, x, y, rx * 4); glow.addColorStop(0, 'rgba(127,214,255,.18)'); glow.addColorStop(1, 'rgba(127,214,255,0)');
  g.fillStyle = glow; g.fillRect(x - rx * 4, y - rx * 4, rx * 8, rx * 8);
  const body = g.createRadialGradient(x + rx * .2, y + ry * .25, 0, x, y, Math.max(rx, ry));
  body.addColorStop(0, 'rgba(10,14,20,.6)'); body.addColorStop(.72, 'rgba(25,40,58,.55)'); body.addColorStop(.92, 'rgba(127,214,255,.55)'); body.addColorStop(1, 'rgba(230,248,255,.85)');
  g.fillStyle = body; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.ellipse(x - rx * .38, y - ry * .42, rx * .22, ry * .12, -.6, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,154,90,.5)'; g.beginPath(); g.ellipse(x + rx * .25, y + ry * .62, rx * .3, ry * .07, .2, 0, 7); g.fill();
}
function scene1(g, t) {
  g.fillStyle = C.void; g.fillRect(0, 0, W, H);
  g.save(); const k = 1 + .02 * seg(t, 0, 4.2); g.translate(W / 2, H / 2); g.scale(k, k); g.translate(-W / 2, -H / 2);
  const p = eOutCubic(seg(t, .4, 2.6)), head = lerp(-60, 960, p);
  const tail = t < 2.6 ? head - 900 * Math.min(1, p * 2.2) : lerp(960 - 900, 960, eInOutCubic(seg(t, 2.6, 3.15)));
  if (t > .4 && t < 3.3) {
    const hz = g.createRadialGradient(head, 540, 0, head, 540, 520); hz.addColorStop(0, 'rgba(127,214,255,.10)'); hz.addColorStop(1, 'rgba(127,214,255,0)');
    g.fillStyle = hz; g.fillRect(0, 0, W, H);
    const lg = g.createLinearGradient(tail, 0, head, 0); lg.addColorStop(0, 'rgba(127,214,255,0)'); lg.addColorStop(.85, 'rgba(160,226,255,.8)'); lg.addColorStop(1, '#ffffff');
    const defocus = 7 * Math.pow(Math.abs(head - 960) / 1020, 1.5);
    g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    g.filter = `blur(${10 + defocus}px)`; g.strokeStyle = lg; g.lineWidth = 10; g.beginPath(); g.moveTo(tail, 540); g.lineTo(head, 540); g.stroke();
    g.filter = `blur(${defocus * .6}px)`; g.lineWidth = 2; g.beginPath(); g.moveTo(tail, 540); g.lineTo(head, 540); g.stroke();
    g.filter = 'none'; g.fillStyle = 'rgba(127,214,255,.9)'; g.fillRect(head - 1, 538.5, 2, 1); g.fillStyle = 'rgba(255,154,90,.4)'; g.fillRect(head - 1, 541, 2, 1);
    g.restore();
  }
  const d = seg(t, 2.95, 3.5);
  if (d > 0) { const r0 = 40 * eOutBack(d), wob = Math.sin((t - 3.2) * 14) * Math.exp(-(t - 3.2) * 2.2) * (t > 3.2 ? .1 : 0);
    droplet(g, 960, 540, r0 * (1 + wob), r0 * (1 - wob)); }
  g.restore();
}

// ───────────────────────────── SCENE 2 · Liquid to Form (4–9) ─────────────────────────────
function liquidStroke(g, P, a, b) {
  if (b - a <= 1) return;
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';

// ───────────────────────────── Player ─────────────────────────────
const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
if (RENDER) document.body.classList.add('render');
let score = null, ac = null, src = null, playing = false, offset = +(params.get('t') || 0), startAt = 0;
const $ = id => document.getElementById(id);

const now = () => playing ? offset + (ac ? ac.currentTime - startAt : (performance.now() / 1000 - startAt)) : offset;
